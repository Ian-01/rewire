<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Retrace — Tutor Dashboard</title>
    <script>
      // Apply a saved manual theme before first paint to avoid a flash.
      (function () {
        try {
          var saved = localStorage.getItem("retrace-theme");
          if (saved === "light" || saved === "dark") {
            document.documentElement.setAttribute("data-theme", saved);
          }
        } catch (e) {
          /* localStorage unavailable — fall back to system preference */
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
